{% extends "base.html" %}

{% block map_script %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="text/javascript">
        var map = null;

        // ----- setup map
        function initialize() {
            map = L.map('map_create', {
                scrollWheelZoom: false,
                dragging: false,
                doubleClickZoom: false
            });
            map.setView([{{ moniton.lat }}, {{ moniton.lng }}], {{ moniton.zoom }});

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }
    </script>
{% endblock %}

{% block title %}Monitor Service{% endblock %}

{% block content %}
    <div class="title span-24 last"><h1>Check Your Monitor Subscription</h1></div>

    <div class="label span-4">Area Monitored :</div>
    <div id="map_create" class="span-20 last"></div>

    <div class="label span-4">Email :</div>
    <div class="field span-20 last">{{ moniton.email }}</div>
{% endblock %}
